13:
  gist: >-
    Why RAG exists: a model's knowledge stops at its pretraining data, so
    anything newer or private is invisible to it.

15:
  gist: >-
    Second limit: the context window is finite, so you cannot simply paste
    the whole knowledge base in.

17:
  gist: >-
    Third: models get distracted by irrelevant context, so more text can
    make answers worse, not better.

19:
  gist: >-
    Fourth: every input token is billed, so stuffing the prompt is a cost
    decision too.

21:
  gist: >-
    RAG's answer: retrieve the relevant pieces and put only those in the
    prompt.

